name: Validate bell schedules

on:
  push:
    paths: ['overrides.json', 'overrides-draft.json', 'core.js', 'scripts/**']
  pull_request:
    paths: ['overrides.json', 'overrides-draft.json', 'core.js', 'scripts/**']
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/validate.mjs overrides.json overrides-draft.json
